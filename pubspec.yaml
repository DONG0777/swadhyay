name: swadhyay_app
description: A Flutter quiz and social-learning platform
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any

  # Supabase & APIs
  supabase_flutter: ^2.0.0
  http: ^1.1.0

  # Local Storage
  shared_preferences: ^2.0.15

  # Sharing & URL
  url_launcher: ^6.1.11

  # GPS Location
  geolocator: ^13.0.1
  permission_handler: ^12.0.1

  # 🎥 ভিডিও প্লেয়ার (সূর্য নমস্কারের জন্য)
  video_player: ^2.9.1
  chewie: ^1.8.3
  fl_chart: ^0.71.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true



